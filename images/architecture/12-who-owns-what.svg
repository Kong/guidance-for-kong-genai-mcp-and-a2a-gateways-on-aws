<rect x="855" y="220" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="244.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Kong routes, plugins, decK files</text>
<rect x="855" y="270" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="294.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Konnect PAT &amp; client secrets</text>
<rect x="855" y="320" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="344.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Agent code (server_1.py, …)</text>
<rect x="855" y="370" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="394.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Domain &amp; DNS records</text>
<rect x="855" y="420" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="444.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Guardrail definitions in Bedrock</text>
<rect x="855" y="470" width="360" height="40" rx="6" fill="#EEF0FF" stroke="#3F4BB8" stroke-width="1.5"/>
<text x="1035.0" y="494.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">Cost monitoring &amp; clean-up</text>
<text x="620" y="585" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Kong runs in your account (data plane) but is managed from Konnect (control plane). AWS keeps owning the services Kong calls.</text>
</svg>

<text x="215.0" y="494.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">IAM and Pod Identity service</text>
<rect x="35" y="520" width="360" height="40" rx="6" fill="#FFF4E5" stroke="#C76E00" stroke-width="1.5"/>
<text x="215.0" y="544.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">CloudWatch</text>
<rect x="430" y="60" width="390" height="46" rx="8" fill="#E8F5EE" stroke="#1B7A4B" stroke-width="1.5"/>
<text x="625.0" y="88.95" text-anchor="middle" font-size="17" font-weight="bold" fill="#1D1F24">Kong-managed</text>
<rect x="445" y="120" width="360" height="40" rx="6" fill="#E8F5EE" stroke="#1B7A4B" stroke-width="1.5"/>

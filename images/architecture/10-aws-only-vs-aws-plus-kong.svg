<line x1="1015" y1="320" x2="937" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1045" y="400" width="165" height="60" rx="8" fill="#FFF4E5" stroke="#C76E00" stroke-width="1.5"/>
<text x="1127.5" y="425.55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D1F24">MCP tools / APIs,</text>
<text x="1127.5" y="443.55" text-anchor="middle" font-size="13" font-weight="normal" fill="#1D1F24">other providers</text>
<line x1="1015" y1="320" x2="1127" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="660" y="590" text-anchor="start" font-size="12" fill="#333" font-style="italic">Apps keep calling one endpoint. Policy lives in one place. AWS services are unchanged.</text>
</svg>

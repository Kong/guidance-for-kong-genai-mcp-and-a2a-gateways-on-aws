# Step 5: require a Kong Identity token on the agent and the MCP server.
# Declares the auth strategy and re-declares the Step 3 agent and Step 4 MCP server
# with an access block. Needs these exported: ISSUER_URL, INTROSPECTION_URL, CLIENT_ID,
# CLIENT_SECRET, CACHE_TOKENS_SALT and AGENTCORE_URL.
ai_gateway_auth_strategies:
  - ref: kong-identity-oidc
    ai_gateway: !lookup {name: kong-aws-ai}
    name: kong-identity-oidc
    display_name: Kong Identity (OAuth2 introspection)
    type: openid-connect
    config:
      issuer: !env ISSUER_URL
      client_id:
        - !env CLIENT_ID
      client_secret:
        - !secret {source: !env CLIENT_SECRET}
      auth_methods:
        - introspection
      introspection_endpoint: !env INTROSPECTION_URL
      ssl_verify: true
      cache_tokens_salt: !env CACHE_TOKENS_SALT

ai_gateway_agents:
  - ref: agentcore-hello
    ai_gateway: !lookup {name: kong-aws-ai}
    name: agentcore-hello
    display_name: AgentCore Hello World Agent
    type: a2a
    enabled: true
    access:
      auth_strategies:
        - !ref kong-identity-oidc
    config:
      url: !env AGENTCORE_URL
      route:
        paths:
          - /a2a
        strip_path: true
      upstream:
        auth:
          type: aws        # SigV4, with the data plane's Pod Identity credentials
          region: us-west-2
      logging:
        payloads: true

ai_gateway_mcp_servers:
  - ref: inventory-tools
    ai_gateway: !lookup {name: kong-aws-ai}
    name: inventory-tools
    display_name: Inventory and Orders Tools
    type: conversion-listener
    enabled: true
    access:
      acl_attribute_type: consumer
      auth_strategies:
        - !ref kong-identity-oidc#name   # MCP servers list strategies by name
    config:
      url: http://httpbin.kong.svc.cluster.local:8080/anything
      route:
        paths:
          - /mcp
      server:
        timeout: 60000
    tools:
      - name: check_inventory
        description: Check how many units of a product are in stock, by SKU.
        method: GET
        path: /mcp/inventory
        parameters:
          - name: sku
            in: query
            required: true
            description: The product SKU to look up.
            schema:
              type: string
      - name: list_orders
        description: List recent orders, optionally filtered by status.
        method: GET
        path: /mcp/orders
        parameters:
          - name: status
            in: query
            required: false
            description: Only return orders with this status, for example shipped.
            schema:
              type: string

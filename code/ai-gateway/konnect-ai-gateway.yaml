# The AI Gateway control plane in Konnect. Uses the Konnect login object from Step 2.
apiVersion: konnect.konghq.com/v1alpha1
kind: KonnectAIGateway
metadata:
  name: kong-aws-ai
  namespace: kong
spec:
  apiSpec:
    name: kong-aws-ai
    displayName: Kong AWS AI Gateway
    description: AI Gateway for the AWS guidance repo
  konnect:
    authRef:
      name: konnect-api-auth-conf

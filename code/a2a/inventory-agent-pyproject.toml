[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "Step 7 inventory agent: model and MCP tools through Kong AI Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] ~= 0.3.26",
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore[a2a,strands-agents] ~= 1.24.0",
    "botocore[crt] ~= 1.43.107",
    "strands-agents[openai] ~= 1.57.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
